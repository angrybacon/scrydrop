name: Release

concurrency: ${{ github.workflow }}-${{ github.ref }}
on: push
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/setup
      - run: pnpm lint

  tests:
    name: Tests Node ${{ matrix.node }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: $/.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - run: pnpm test:coverage
      - uses: davelosert/vitest-coverage-report-action@v2
        if: ${{ !cancelled() }}
        with:
          file-coverage-mode: all
          pr-number: auto
          threshold-icons: "{0: '🟠', 80: '🟡', 90: '⚪'}"
    strategy:
      matrix:
        node: [22, 24, 26]
        os: [macos-latest, ubuntu-latest]

  publish:
    name: Publish
    if: ${{ github.ref == 'refs/heads/master' }}
    needs: [lint, tests]
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/setup
      - run: pnpm build
      - run: pnpx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
